[project]
name = "canvas-cli"
version = "0.3.0"
description = "Course-authoring CLI for Canvas LMS: write lectures, homework, and syllabi in markdown and sync them to Canvas."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Jonathan Zrake", email = "jonathan.zrake@gmail.com" },
]
keywords = ["canvas", "lms", "markdown", "education", "teaching", "latex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "markdown>=3.5",
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.60",
]
dev = [
    "pytest>=7.0",
    "build",
]

[project.urls]
Homepage = "https://github.com/jzrake/canvas-cli"
Issues = "https://github.com/jzrake/canvas-cli/issues"

[project.scripts]
canvas = "canvas_cli.cli:main"
md2html = "canvas_cli.md2html:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
