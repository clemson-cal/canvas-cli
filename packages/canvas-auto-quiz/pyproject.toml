[project]
name = "canvas-auto-quiz"
version = "0.1.0"
description = "Quiz-bank plugin for canvas-md: write T/F statement pools in markdown and sample them into Canvas quizzes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Jonathan Zrake", email = "jonathan.zrake@gmail.com" },
]
keywords = ["canvas", "lms", "markdown", "education", "teaching", "quiz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "canvas-md>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
]

[project.urls]
Homepage = "https://github.com/clemson-cal/canvas-md"
Issues = "https://github.com/clemson-cal/canvas-md/issues"

[project.entry-points."canvas_md.commands"]
quiz = "canvas_auto_quiz.cli:register"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
